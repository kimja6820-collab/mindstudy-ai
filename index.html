<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindStudy AI - ระบบวางแผนการเรียนและดูแลสุขภาพจิต</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-8">
    
    <!-- Header -->
    <header class="text-center border-b pb-6">
      <h1 class="text-3xl font-bold text-indigo-600">🧠 MindStudy AI</h1>
      <p class="text-slate-500 mt-2">ช่วยจัดตารางอ่านหนังสือและผ่อนคลายความเครียดเฉพาะบุคคล</p>
    </header>

    <!-- Banner แสดงข้อมูลเดิม (ถ้าระบบจำได้) -->
    <div id="historyBanner" class="hidden bg-indigo-50 border border-indigo-200 text-indigo-800 p-4 rounded-xl text-sm flex justify-between items-center">
      <span id="historyText">ยินดีต้อนรับกลับมา!</span>
      <button onclick="resetData()" class="text-xs bg-indigo-200 hover:bg-indigo-300 px-3 py-1 rounded-lg transition">เริ่มใหม่</button>
    </div>

    <!-- Step 1: ประเมินความเครียด -->
    <section class="space-y-4">
      <h2 class="text-xl font-semibold text-slate-700 flex items-center gap-2">
        <span>1.</span> ประเมินความรู้สึกวันนี้
      </h2>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="setStress(25)" class="p-3 border rounded-xl hover:bg-emerald-50 hover:border-emerald-400 text-left transition">
          <div class="font-bold text-emerald-600">ก. สบายๆ</div>
          <div class="text-xs text-slate-500">พร้อมอ่านหนังสือ</div>
        </button>
        <button onclick="setStress(50)" class="p-3 border rounded-xl hover:bg-amber-50 hover:border-amber-400 text-left transition">
          <div class="font-bold text-amber-600">ข. กังวลเล็กน้อย</div>
          <div class="text-xs text-slate-500">เริ่มมีความกดดัน</div>
        </button>
        <button onclick="setStress(75)" class="p-3 border rounded-xl hover:bg-orange-50 hover:border-orange-400 text-left transition">
          <div class="font-bold text-orange-600">ค. เครียดพอสมควร</div>
          <div class="text-xs text-slate-500">หัวกลวง อ่านไม่เข้าหัว</div>
        </button>
        <button onclick="setStress(100)" class="p-3 border rounded-xl hover:bg-rose-50 hover:border-rose-400 text-left transition">
          <div class="font-bold text-rose-600">ง. เครียดมาก</div>
          <div class="text-xs text-slate-500">ใกล้สอบแต่อ่านไม่ทัน</div>
        </button>
      </div>
    </section>

    <!-- Step 2: กรอกข้อมูลบทเรียน -->
    <section class="space-y-4">
      <h2 class="text-xl font-semibold text-slate-700 flex items-center gap-2">
        <span>2.</span> ใส่ข้อมูลวิชาและบทเรียน
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input id="subjectInput" type="text" placeholder="ชื่อวิชา (เช่น ชีววิทยา)" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none">
        <input id="hoursInput" type="number" placeholder="เวลาที่มีวันนี้ (ชั่วโมง)" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none">
      </div>
      <textarea id="contentInput" rows="4" placeholder="แปะเนื้อหาบทเรียน หรือชีทสรุปสั้นๆ ที่นี่..." class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 outline-none"></textarea>
      
      <button onclick="generatePlan()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow-lg transition">
        ✨ ให้ AI วิเคราะห์ความเครียด & วางแผนการอ่าน
      </button>
    </section>

    <!-- Loading State -->
    <div id="loading" class="hidden text-center py-6 text-indigo-600 animate-pulse">
      กำลังประมวลผลด้วย AI กรุณารอแป๊บเดียวนะครับ...
    </div>

    <!-- Step 3: ผลลัพธ์จาก AI -->
    <section id="resultSection" class="hidden space-y-6 border-t pt-6">
      <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
        <h3 class="font-bold text-indigo-900 mb-1">💡 คำแนะนำฮีลใจจาก AI</h3>
        <p id="aiAdvice" class="text-indigo-800 text-sm"></p>
      </div>

      <div>
        <h3 class="font-bold text-slate-700 mb-3">📇 Flashcards สรุปประเด็นสำคัญ (80/20)</h3>
        <div id="flashcardsContainer" class="grid grid-cols-1 gap-3"></div>
      </div>

      <div>
        <h3 class="font-bold text-slate-700 mb-3">📅 ตารางอ่านหนังสืออัจฉริยะ (Pomodoro)</h3>
        <div id="scheduleContainer" class="space-y-2"></div>
      </div>
    </section>

  </div>

  <script src="db-service.js"></script>
  <script src="ai-service.js"></script>
</body>
</html>
