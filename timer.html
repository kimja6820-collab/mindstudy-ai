<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindStudy AI - จับเวลาอ่านหนังสือ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-xl mx-auto space-y-6 text-center">
    
    <header class="flex justify-between items-center bg-white p-4 rounded-2xl border">
      <a href="dashboard.html" class="text-sm font-bold text-indigo-600">← กลับแดชบอร์ด</a>
      <h1 class="font-bold text-slate-700">โหมดจับเวลาอ่านหนังสือ</h1>
    </header>

    <div class="bg-white p-8 rounded-2xl border shadow-sm space-y-6">
      
      <!-- เลือกโหมด -->
      <div class="flex justify-center gap-2">
        <button onclick="setMode('pomodoro', 25)" class="px-4 py-2 border rounded-xl font-semibold text-xs active:bg-indigo-50">Pomodoro (25 นาที)</button>
        <button onclick="setMode('60_5', 60)" class="px-4 py-2 border rounded-xl font-semibold text-xs active:bg-indigo-50">อ่าน 60 นาที</button>
      </div>

      <div>
        <input id="subjectInput" type="text" placeholder="วิชาที่กำลังจะอ่าน..." class="w-full p-3 border rounded-xl text-center outline-none">
      </div>

      <!-- Display ตัวเลขจับเวลา -->
      <div id="timerDisplay" class="text-6xl font-extrabold text-indigo-600 tracking-wider">25:00</div>

      <div class="flex justify-center gap-3">
        <button id="startBtn" onclick="toggleTimer()" class="bg-indigo-600 text-white font-bold px-8 py-3 rounded-xl shadow-md hover:bg-indigo-700">เริ่มอ่าน</button>
        <button onclick="resetTimer()" class="bg-slate-200 text-slate-600 font-bold px-6 py-3 rounded-xl">รีเซ็ต</button>
      </div>
    </div>

    <!-- มินิเกม Modal (ซ่อนอยู่) -->
    <div id="gameModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4">
      <div class="bg-white p-6 rounded-2xl max-w-sm w-full space-y-4 text-center">
        <h3 class="font-bold text-lg text-emerald-600">🎉 อ่านจบแล้ว! พักสมองเล่นเกมเป่ายิงฉุบ</h3>
        <p class="text-xs text-slate-500">เลือกเลยจะออกอะไร:</p>
        <div class="flex justify-center gap-4 text-2xl">
          <button onclick="playRPS('✊')" class="p-3 border rounded-xl hover:bg-slate-100">✊</button>
          <button onclick="playRPS('✋')" class="p-3 border rounded-xl hover:bg-slate-100">✋</button>
          <button onclick="playRPS('✌️')" class="p-3 border rounded-xl hover:bg-slate-100">✌️</button>
        </div>
        <div id="rpsResult" class="text-sm font-bold text-indigo-600"></div>
        <button onclick="closeGame()" class="w-full bg-slate-200 py-2 rounded-xl text-xs font-bold">ปิดมินิเกม</button>
      </div>
    </div>

  </div>

  <script type="module">
    import { supabase } from './js/supabase-config.js';

    let timer = null;
    let totalSeconds = 25 * 60;
    let initialMinutes = 25;
    let isRunning = false;
    let currentMode = 'pomodoro';

    window.setMode = (mode, minutes) => {
      currentMode = mode;
      initialMinutes = minutes;
      totalSeconds = minutes * 60;
      updateDisplay();
    };

    function updateDisplay() {
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').innerText = `${m}:${s}`;
    }

    window.toggleTimer = () => {
      if (isRunning) {
        clearInterval(timer);
        document.getElementById('startBtn').innerText = 'ลุยต่อ';
      } else {
        timer = setInterval(async () => {
          if (totalSeconds > 0) {
            totalSeconds--;
            updateDisplay();
          } else {
            clearInterval(timer);
            await finishSession();
          }
        }, 1000);
        document.getElementById('startBtn').innerText = 'หยุดชั่วคราว';
      }
      isRunning = !isRunning;
    };

    window.resetTimer = () => {
      clearInterval(timer);
      isRunning = false;
      totalSeconds = initialMinutes * 60;
      updateDisplay();
      document.getElementById('startBtn').innerText = 'เริ่มอ่าน';
    };

    async function finishSession() {
      const subject = document.getElementById('subjectInput').value || 'วิชาทั่วไป';
      const { data: { user } } = await supabase.auth.getUser();

      await supabase.from('study_sessions').insert([{
        user_id: user.id,
        subject: subject,
        duration_minutes: initialMinutes,
        mode: currentMode,
        study_date: new Date().toISOString().split('T')[0]
      }]);

      document.getElementById('gameModal').classList.remove('hidden');
    }

    window.playRPS = (userChoice) => {
      const choices = ['✊', '✋', '✌️'];
      const aiChoice = choices[Math.floor(Math.random() * 3)];
      document.getElementById('rpsResult').innerText = `คุณ: ${userChoice} vs AI: ${aiChoice}`;
    };

    window.closeGame = () => {
      document.getElementById('gameModal').classList.add('hidden');
      resetTimer();
    };
  </script>
</body>
</html>
