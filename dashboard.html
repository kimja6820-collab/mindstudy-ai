<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindStudy AI - หน้าหลัก</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col">

  <!-- 1. Navigation Bar -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <!-- Logo & Navigation Links -->
        <div class="flex items-center space-x-8">
          <span class="text-2xl font-extrabold text-indigo-600 flex items-center gap-2">
            🧠 MindStudy AI
          </span>
          <div class="hidden md:flex space-x-4">
            <a href="dashboard.html" class="text-indigo-600 font-bold px-3 py-2 rounded-lg bg-indigo-50">หน้าหลัก</a>
            <a href="timer.html" class="text-slate-600 hover:text-indigo-600 font-medium px-3 py-2 rounded-lg transition">จับเวลาเรียน</a>
            <a href="calendar.html" class="text-slate-600 hover:text-indigo-600 font-medium px-3 py-2 rounded-lg transition">ปฏิทินวางแผน</a>
            <a href="minigame.html" class="text-slate-600 hover:text-indigo-600 font-medium px-3 py-2 rounded-lg transition">เควสห้องอ่านหนังสือ</a>
          </div>
        </div>

        <!-- Right Menu: User Profile & Points -->
        <div class="relative group">
          <button class="flex items-center space-x-3 bg-slate-100 hover:bg-indigo-50 p-2 rounded-full border border-slate-200 transition">
            <div class="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-sm" id="userAvatar">
              U
            </div>
            <span class="text-sm font-semibold text-slate-700 pr-2 hidden sm:inline" id="userEmailDisplay">Loading...</span>
          </button>

          <!-- Hover Dropdown Modal -->
          <div class="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-slate-100 p-4 hidden group-hover:block transition-all duration-200 z-50">
            <div class="text-xs text-slate-400 font-medium">คะแนนสะสมของคุณ</div>
            <div class="text-2xl font-black text-amber-500 my-1 flex items-center gap-1">
              ⭐ <span id="userPointsDisplay">0</span> <span class="text-xs font-normal text-slate-500">Points</span>
            </div>
            <hr class="my-3 border-slate-100">
            <button onclick="window.handleLogout()" class="w-full text-left text-sm font-semibold text-rose-500 hover:bg-rose-50 p-2 rounded-xl transition">
              🚪 ออกจากระบบ
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 space-y-8">

    <!-- Section 1: Points Summary Stat -->
    <section class="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl p-6 text-white shadow-lg">
      <h2 class="text-xl font-bold mb-4">⭐ คะแนนสะสมของคุณ</h2>
      <div class="bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 flex items-center justify-between">
        <div>
          <div class="text-sm text-indigo-100 font-medium">Point ที่ได้รับสะสมทั้งหมด</div>
          <div class="text-4xl font-extrabold text-amber-300 mt-1" id="earnedPoints">0 PT</div>
        </div>
        <div class="text-5xl">🏆</div>
      </div>
    </section>

    <!-- Section 2: Stress Assessment & Diary -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Write Entry Form (2 Cols) -->
      <div class="lg:col-span-2 bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-6">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="text-xl font-bold text-slate-800">📝 แบบประเมินความเครียด & ไดอารี่วันนี้</h2>
            <p class="text-xs text-slate-400 mt-1">บันทึกความรู้สึกได้สูงสุด 3 ครั้ง/วัน</p>
          </div>
          <span class="text-xs font-bold px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full" id="dailyLimitBadge">
            โควต้าวันนี้: 0/3
          </span>
        </div>

        <!-- Mood Selector -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2">1. ระดับความเครียด/ความรู้สึกขณะนี้</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="stressOptions">
            <button type="button" onclick="window.selectStress('สบายๆ', '😊', event)" class="stress-btn p-3 border-2 border-slate-100 rounded-2xl text-left hover:border-emerald-400 transition" data-level="สบายๆ">
              <span class="text-2xl">😊</span>
              <div class="font-bold text-slate-700 text-sm mt-1">สบายๆ</div>
              <div class="text-[10px] text-slate-400">พร้อมลุยอ่าน</div>
            </button>
            <button type="button" onclick="window.selectStress('กังวลนิดหน่อย', '😐', event)" class="stress-btn p-3 border-2 border-slate-100 rounded-2xl text-left hover:border-amber-400 transition" data-level="กังวลนิดหน่อย">
              <span class="text-2xl">😐</span>
              <div class="font-bold text-slate-700 text-sm mt-1">กังวลนิดหน่อย</div>
              <div class="text-[10px] text-slate-400">พอรับมือไหว</div>
            </button>
            <button type="button" onclick="window.selectStress('เครียดมาก', '😰', event)" class="stress-btn p-3 border-2 border-slate-100 rounded-2xl text-left hover:border-orange-400 transition" data-level="เครียดมาก">
              <span class="text-2xl">😰</span>
              <div class="font-bold text-slate-700 text-sm mt-1">เครียดมาก</div>
              <div class="text-[10px] text-slate-400">เริ่มอึดอัด</div>
            </button>
            <button type="button" onclick="window.selectStress('เครียดที่สุด', '😫', event)" class="stress-btn p-3 border-2 border-slate-100 rounded-2xl text-left hover:border-rose-400 transition" data-level="เครียดที่สุด">
              <span class="text-2xl">😫</span>
              <div class="font-bold text-slate-700 text-sm mt-1">เครียดที่สุด</div>
              <div class="text-[10px] text-slate-400">จะไม่ไหวแล้ว</div>
            </button>
          </div>
        </div>

        <!-- Diary Textarea -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2">2. เล่าความรู้สึกหรือสิ่งที่เจอในวันนี้ (ไดอารี่)</label>
          <textarea id="diaryInput" rows="4" placeholder="วันนี้รู้สึกอย่างไรบ้าง มีเรื่องอะไรกังวลใจไหม..." class="w-full p-4 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-400 text-sm"></textarea>
        </div>

        <button id="saveDiaryBtn" onclick="window.handleSaveDiary()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition shadow-md">
          บันทึกไดอารี่
        </button>
      </div>

      <!-- History Sidebar (1 Col) -->
      <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col">
        <h2 class="text-xl font-bold text-slate-800 mb-4">📜 ประวัติบันทึกย้อนหลัง</h2>
        <div id="historyList" class="space-y-4 overflow-y-auto max-h-[420px] pr-1 flex-1">
          <p class="text-slate-400 text-sm text-center py-8">ยังไม่มีประวัติบันทึก</p>
        </div>
      </div>

    </section>
  </main>

  <script type="module">
    import { supabase } from './js/supabase-config.js';

    let selectedStress = '';
    let selectedEmoji = '';
    let currentUser = null;

    // ตรวจสอบ Session เมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;
      document.getElementById('userEmailDisplay').innerText = user.email;
      document.getElementById('userAvatar').innerText = user.email ? user.email.charAt(0).toUpperCase() : 'U';

      await loadUserData();
      await loadTodayDiaries();
    });

    // ดึงข้อมูล Points จากตาราง profiles
    async function loadUserData() {
      const { data, error } = await supabase
        .from('profiles')
        .select('points')
        .eq('id', currentUser.id)
        .single();

      if (data && !error) {
        const points = parseFloat(data.points) || 0;
        document.getElementById('userPointsDisplay').innerText = points;
        document.getElementById('earnedPoints').innerText = `${points} PT`;
      }
    }

    // เลือกความเครียด
    window.selectStress = function(level, emoji, event) {
      selectedStress = level;
      selectedEmoji = emoji;
      document.querySelectorAll('.stress-btn').forEach(btn => {
        btn.classList.remove('border-indigo-600', 'bg-indigo-50');
      });
      if (event && event.currentTarget) {
        event.currentTarget.classList.add('border-indigo-600', 'bg-indigo-50');
      }
    };

    // บันทึก ไดอารี่ + แบบประเมิน
    window.handleSaveDiary = async function() {
      const diaryText = document.getElementById('diaryInput').value.trim();
      if (!selectedStress) return alert('กรุณาเลือกระดับความเครียด');
      if (!diaryText) return alert('กรุณากรอกข้อความไดอารี่');

      // ตรวจสอบโควต้า 3 ครั้ง/วัน
      const today = new Date();
      const startOfTodayISO = new Date(today.getFullYear(), today.getMonth(), today.getDate()).toISOString();

      const { data: todayEntries } = await supabase
        .from('diaries')
        .select('id')
        .eq('user_id', currentUser.id)
        .gte('created_at', startOfTodayISO);

      if (todayEntries && todayEntries.length >= 3) {
        return alert('คุณบันทึกไดอารี่ครบ 3 ครั้งสำหรับวันนี้แล้วครับ');
      }

      // บันทึกลง Supabase
      const { error } = await supabase.from('diaries').insert([{
        user_id: currentUser.id,
        stress_level: selectedStress,
        emoji: selectedEmoji,
        content: diaryText
      }]);

      if (error) {
        alert('เกิดข้อผิดพลาด: ' + error.message);
      } else {
        alert('บันทึกไดอารี่สำเร็จ!');
        document.getElementById('diaryInput').value = '';
        await loadTodayDiaries();
      }
    };

    // โหลดประวัติย้อนหลัง
    async function loadTodayDiaries() {
      const { data, error } = await supabase
        .from('diaries')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });

      const historyContainer = document.getElementById('historyList');
      const today = new Date();
      const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      if (data) {
        const todayCount = data.filter(item => item.created_at && new Date(item.created_at) >= startOfToday).length;
        document.getElementById('dailyLimitBadge').innerText = `โควต้าวันนี้: ${todayCount}/3`;

        if (data.length === 0) {
          historyContainer.innerHTML = `<p class="text-slate-400 text-sm text-center py-8">ยังไม่มีประวัติบันทึก</p>`;
          return;
        }

        historyContainer.innerHTML = data.map(item => `
          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100 space-y-2">
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-indigo-600 flex items-center gap-1">
                ${item.emoji || '📝'} ${item.stress_level}
              </span>
              <span class="text-slate-400">${new Date(item.created_at).toLocaleString('th-TH')}</span>
            </div>
            <p class="text-sm text-slate-700 font-medium">${item.content}</p>
          </div>
        `).join('');
      }
    }

    // ออกจากระบบ
    window.handleLogout = async function() {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
