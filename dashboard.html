<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindStudy AI - แดชบอร์ด</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Navbar -->
    <header class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center border">
      <h1 class="text-xl font-bold text-indigo-600">🧠 MindStudy AI</h1>
      <nav class="flex gap-4 text-sm font-semibold text-slate-600">
        <a href="dashboard.html" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">หน้าหลัก</a>
        <a href="timer.html" class="hover:text-indigo-600">จับเวลาเรียน</a>
        <a href="calendar.html" class="hover:text-indigo-600">ปฏิทินวางแผน</a>
        <button onclick="logout()" class="text-rose-500 hover:underline">ออกจากระบบ</button>
      </nav>
    </header>

    <!-- สถิติส่วนตัว -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border shadow-sm text-center">
        <div class="text-xs text-slate-500">อ่านวันนี้</div>
        <div id="todayTotal" class="text-2xl font-bold text-indigo-600 mt-1">0 นาที</div>
      </div>
      <div class="bg-white p-4 rounded-xl border shadow-sm text-center">
        <div class="text-xs text-slate-500">รวมสัปดาห์นี้</div>
        <div id="weeklyTotal" class="text-2xl font-bold text-emerald-600 mt-1">0 ชม.</div>
      </div>
      <div class="bg-white p-4 rounded-xl border shadow-sm text-center">
        <div class="text-xs text-slate-500">อ่านนานสุด/รอบ</div>
        <div id="maxStat" class="text-2xl font-bold text-amber-600 mt-1">0 นาที</div>
      </div>
      <div class="bg-white p-4 rounded-xl border shadow-sm text-center">
        <div class="text-xs text-slate-500">อ่านสั้นสุด/รอบ</div>
        <div id="minStat" class="text-2xl font-bold text-rose-500 mt-1">0 นาที</div>
      </div>
    </section>

    <!-- แบบประเมินความเครียด -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
      <h2 class="text-lg font-bold text-slate-700">📝 แบบประเมินความรู้สึก & ความเครียดวันนี้</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <button onclick="saveStress(25)" class="p-3 border rounded-xl hover:bg-emerald-50 text-left transition border-emerald-200">
          <div class="font-bold text-emerald-600">ก. สบายๆ</div>
          <div class="text-xs text-slate-400">พร้อมลุยอ่าน</div>
        </button>
        <button onclick="saveStress(50)" class="p-3 border rounded-xl hover:bg-amber-50 text-left transition border-amber-200">
          <div class="font-bold text-amber-600">ข. กังวลนิดหน่อย</div>
          <div class="text-xs text-slate-400">พอรับมือไหว</div>
        </button>
        <button onclick="saveStress(75)" class="p-3 border rounded-xl hover:bg-orange-50 text-left transition border-orange-200">
          <div class="font-bold text-orange-600">ค. เครียดมาก</div>
          <div class="text-xs text-slate-400">เริ่มอึดอัด</div>
        </button>
        <button onclick="saveStress(100)" class="p-3 border rounded-xl hover:bg-rose-50 text-left transition border-rose-200">
          <div class="font-bold text-rose-600">ง. เครียดที่สุด</div>
          <div class="text-xs text-slate-400">จะไม่ไหวแล้ว</div>
        </button>
      </div>
      <div id="stressHistory" class="text-xs text-slate-400 pt-2">ประวัติล่าสุด: -</div>
    </section>

  </div>

  <script type="module">
    import { supabase } from './js/supabase-config.js';

    let currentUser = null;

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) window.location.href = 'index.html';
      currentUser = user;
      loadStats();
    }

    window.saveStress = async (score) => {
      const { error } = await supabase.from('stress_logs').insert([{
        user_id: currentUser.id,
        stress_score: score
      }]);
      if (!error) alert('บันทึกระดับความเครียดเรียบร้อย!');
      else alert(error.message);
    };

    async function loadStats() {
      const { data: sessions } = await supabase.from('study_sessions').select('*').eq('user_id', currentUser.id);
      
      if (sessions && sessions.length > 0) {
        const today = new Date().toISOString().split('T')[0];
        const todayTotal = sessions.filter(s => s.study_date === today).reduce((a, b) => a + b.duration_minutes, 0);
        
        const minutes = sessions.map(s => s.duration_minutes);
        const max = Math.max(...minutes);
        const min = Math.min(...minutes);
        const totalAll = minutes.reduce((a, b) => a + b, 0);

        document.getElementById('todayTotal').innerText = `${todayTotal} นาที`;
        document.getElementById('weeklyTotal').innerText = `${(totalAll/60).toFixed(1)} ชม.`;
        document.getElementById('maxStat').innerText = `${max} นาที`;
        document.getElementById('minStat').innerText = `${min} นาที`;
      }
    }

    window.logout = async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    };

    init();
  </script>
</body>
</html>
