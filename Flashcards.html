<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education Flashcards - แฟลชการ์ดเพื่อการศึกษา</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="w-full py-4 px-6 bg-white border-b border-slate-200 shadow-sm flex justify-between items-center relative">
        <!-- ปุ่มย้อนกลับไปหน้าหลัก -->
        <a href="dashboard.html" class="flex items-center gap-2 text-slate-600 hover:text-primary-600 font-medium transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>หน้าหลัก</span>
        </a>

        <div class="text-center">
            <h1 class="text-2xl md:text-3xl font-extrabold text-primary-700">
                Education Flashcards
            </h1>
            <p class="text-slate-500 text-xs md:text-sm mt-0.5">แฟลชการ์ดเพื่อการเรียนรู้และพัฒนาทักษะ</p>
        </div>

        <!-- กล่องแสดงคะแนน -->
        <div class="bg-amber-50 border border-amber-200 text-amber-800 px-4 py-1.5 rounded-full flex items-center gap-2 shadow-sm">
            <svg class="w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            <span class="text-xs font-semibold uppercase tracking-wider hidden sm:inline">คะแนน:</span>
            <span id="score-display" class="font-bold text-base text-amber-600">0</span>
            <span class="text-xs">พ้อยท์</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-4xl mx-auto w-full">
        
        <!-- Top Toolbar: หมวดหมู่, เพิ่มการ์ด, ลบการ์ด -->
        <div class="w-full max-w-md flex justify-between items-center mb-4 text-slate-600 text-sm">
            <span id="category-badge" class="px-3 py-1 rounded-full bg-primary-100 border border-primary-200 text-xs font-semibold tracking-wider text-primary-700">
                Category
            </span>
            <div class="flex items-center gap-2">
                <button id="open-add-modal-btn" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1 shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    เพิ่มการ์ด
                </button>
                <button id="delete-card-btn" class="text-xs bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    ลบ
                </button>
                <span id="progress-text" class="font-medium ml-2 text-slate-500">
                    Card 1 of 1
                </span>
            </div>
        </div>

        <!-- Flashcard Container -->
        <div class="w-full max-w-md h-80 perspective-1000 cursor-pointer" id="flashcard-container">
            <div id="flashcard" class="w-full h-full relative transform-style-3d transition-transform duration-500 rounded-2xl shadow-md border border-slate-200">
                
                <!-- Front Side -->
                <div class="absolute inset-0 w-full h-full rounded-2xl bg-white p-8 flex flex-col justify-between backface-hidden shadow-sm">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <span class="text-xs font-semibold text-primary-600 tracking-wider uppercase">คำถาม / หัวข้อ</span>
                        <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div class="text-center my-auto px-2">
                        <h2 id="card-front-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-snug">
                            Loading...
                        </h2>
                    </div>
                    <div class="text-center text-xs text-slate-400 border-t border-slate-100 pt-3">
                        คลิกเพื่อพลิกดูเฉลย
                    </div>
                </div>

                <!-- Back Side -->
                <div class="absolute inset-0 w-full h-full rounded-2xl bg-sky-50 p-8 flex flex-col justify-between border-2 border-primary-200 rotate-y-180 backface-hidden shadow-sm">
                    <div class="flex justify-between items-center border-b border-sky-100 pb-3">
                        <span class="text-xs font-semibold text-primary-700 tracking-wider uppercase">คำอธิบาย / คำตอบ</span>
                        <svg class="w-5 h-5 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div class="text-center my-auto px-2">
                        <p id="card-back-text" class="text-lg md:text-xl text-slate-700 leading-relaxed font-medium">
                            Loading...
                        </p>
                    </div>
                    <div class="text-center text-xs text-primary-600/70 border-t border-sky-100 pt-3">
                        คลิกอีกครั้งเพื่อพลิกกลับ
                    </div>
                </div>

            </div>
        </div>

        <!-- Controls -->
        <div class="w-full max-w-md flex flex-col gap-3 mt-6">
            <!-- ปุ่มให้คะแนนเมื่อจำได้ -->
            <button id="remember-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl transition-all font-bold flex items-center justify-center gap-2 shadow-md shadow-emerald-200">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                จำได้ (+0.5 พอยท์)
            </button>

            <!-- ปุ่มเปลี่ยนการ์ด -->
            <div class="flex items-center justify-between gap-3">
                <button id="prev-btn" class="flex-1 bg-white hover:bg-slate-50 text-slate-700 py-2.5 rounded-xl border border-slate-300 transition-all font-semibold flex items-center justify-center gap-1.5 shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    ย้อนกลับ
                </button>

                <button id="shuffle-btn" class="p-2.5 bg-white hover:bg-slate-50 text-slate-600 rounded-xl border border-slate-300 transition-all shadow-sm" title="สุ่มการ์ด">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>

                <button id="next-btn" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white py-2.5 rounded-xl transition-all font-semibold flex items-center justify-center gap-1.5 shadow-sm">
                    ถัดไป
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">
        Education Flashcard Application &bull; Hosted on GitHub
    </footer>

    <!-- Modal สำหรับเพิ่มการ์ดใหม่ -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
            <h3 class="text-xl font-bold text-slate-800 mb-4">เพิ่มการ์ดใหม่</h3>
            <form id="add-card-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">คำถาม / ด้านหน้า</label>
                    <input type="text" id="input-front" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm" placeholder="เช่น Pedagogy">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">คำตอบ / ด้านหลัง</label>
                    <textarea id="input-back" required rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm" placeholder="เช่น ศาสตร์และศิลป์แห่งการสอนเด็ก..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">หมวดหมู่</label>
                    <input type="text" id="input-category" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm" placeholder="เช่น General, Math, Theory">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" id="close-add-modal-btn" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg shadow-sm transition-colors">บันทึกการ์ด</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Data and App Logic -->
    <script>
        // ข้อมูลเริ่มต้นสำหรับกรณีเพิ่งใช้งานครั้งแรก
        const defaultFlashcards = [
            {
                front: "Pedagogy",
                back: "ศาสตร์และศิลป์แห่งการสอนเด็ก หรือวิธีการสอนโดยเน้นผู้เรียนและครูเป็นศูนย์กลางการเรียนรู้",
                category: "Terminology"
            },
            {
                front: "Andragogy",
                back: "แนวทางการจัดการเรียนรู้สำหรับผู้ใหญ่ (Adult Learning) ที่เน้นประสบการณ์และการนำไปใช้จริง",
                category: "Terminology"
            },
            {
                front: "Bloom's Taxonomy",
                back: "การจำแนกวัตถุประสงค์การเรียนรู้ 6 ระดับ: จำ -> เข้าใจ -> ประยุกต์ใช้ -> วิเคราะห์ -> ประเมินค่า -> สร้างสรรค์",
                category: "Theory"
            },
            {
                front: "Formative Assessment",
                back: "การประเมินเพื่อปรับปรุงและพัฒนาการเรียนรู้ระหว่างกระบวนการสอน (เช่น ควิซสั้น, การตั้งคำถาม)",
                category: "Assessment"
            },
            {
                front: "Active Learning",
                back: "กระบวนการเรียนรู้ที่ให้ผู้เรียนมีส่วนร่วมในการคิด วิเคราะห์ ทำกิจกรรม และสรุปองค์ความรู้ด้วยตนเอง",
                category: "Strategy"
            }
        ];

        // โหลดข้อมูลการ์ดจาก localStorage (หากไม่มีให้ใช้ default)
        let flashcards = JSON.parse(localStorage.getItem('flashcards')) || defaultFlashcards;
        
        // โหลดคะแนนสะสมจาก localStorage
        let score = parseFloat(localStorage.getItem('userScore')) || 0;

        let currentIndex = 0;
        let isFlipped = false;

        // Elements
        const cardElement = document.getElementById('flashcard');
        const containerElement = document.getElementById('flashcard-container');
        const frontText = document.getElementById('card-front-text');
        const backText = document.getElementById('card-back-text');
        const categoryBadge = document.getElementById('category-badge');
        const progressText = document.getElementById('progress-text');
        const scoreDisplay = document.getElementById('score-display');

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const rememberBtn = document.getElementById('remember-btn');
        const deleteCardBtn = document.getElementById('delete-card-btn');

        // Modal Elements
        const addModal = document.getElementById('add-modal');
        const openAddModalBtn = document.getElementById('open-add-modal-btn');
        const closeAddModalBtn = document.getElementById('close-add-modal-btn');
        const addCardForm = document.getElementById('add-card-form');

        // อัปเดตการแสดงผลคะแนน
        function updateScoreDisplay() {
            scoreDisplay.textContent = score.toFixed(1);
            localStorage.setItem('userScore', score.toString());
        }

        // บันทึกการ์ดลง localStorage
        function saveCardsToStorage() {
            localStorage.setItem('flashcards', JSON.stringify(flashcards));
        }

        function updateCard() {
            if (isFlipped) {
                cardElement.classList.remove('rotate-y-180');
                isFlipped = false;
                setTimeout(renderContent, 200);
            } else {
                renderContent();
            }
        }

        function renderContent() {
            if (flashcards.length === 0) {
                frontText.textContent = "ไม่มีการ์ดในระบบ";
                backText.textContent = "กรุณากดปุ่ม 'เพิ่มการ์ด' ด้านบนเพื่อสร้างการ์ดใหม่";
                categoryBadge.textContent = "Empty";
                progressText.textContent = "0 of 0";
                return;
            }

            const currentCard = flashcards[currentIndex];
            frontText.textContent = currentCard.front;
            backText.textContent = currentCard.back;
            categoryBadge.textContent = currentCard.category;
            progressText.textContent = `Card ${currentIndex + 1} of ${flashcards.length}`;
        }

        // Event Listeners การพลิกการ์ด
        containerElement.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            isFlipped = !isFlipped;
            cardElement.classList.toggle('rotate-y-180', isFlipped);
        });

        // ปุ่มถัดไป
        nextBtn.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            currentIndex = (currentIndex + 1) % flashcards.length;
            updateCard();
        });

        // ปุ่มย้อนกลับ
        prevBtn.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
            updateCard();
        });

        // ปุ่มสุ่ม
        shuffleBtn.addEventListener('click', () => {
            if (flashcards.length <= 1) return;
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentIndex = 0;
            updateCard();
        });

        // ปุ่มจำได้ (+0.5 พ้อยท์)
        rememberBtn.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            score += 0.5;
            updateScoreDisplay();
            
            // ไปการ์ดถัดไป
            currentIndex = (currentIndex + 1) % flashcards.length;
            updateCard();
        });

        // ปุ่มลบการ์ด
        deleteCardBtn.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            
            if (confirm("คุณต้องการลบการ์ดใบนี้ใช่หรือไม่?")) {
                flashcards.splice(currentIndex, 1);
                saveCardsToStorage();
                
                if (currentIndex >= flashcards.length && flashcards.length > 0) {
                    currentIndex = flashcards.length - 1;
                }
                updateCard();
            }
        });

        // จัดการ Modal
        openAddModalBtn.addEventListener('click', () => addModal.classList.remove('hidden'));
        closeAddModalBtn.addEventListener('click', () => addModal.classList.add('hidden'));

        // บันทึกฟอร์มเพิ่มการ์ด
        addCardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const front = document.getElementById('input-front').value.trim();
            const back = document.getElementById('input-back').value.trim();
            const category = document.getElementById('input-category').value.trim();

            if (front && back && category) {
                flashcards.push({ front, back, category });
                saveCardsToStorage();
                
                addCardForm.reset();
                addModal.classList.add('hidden');

                // แสดงผลการ์ดใบใหม่ทันที
                currentIndex = flashcards.length - 1;
                updateCard();
            }
        });

        // Key bindings
        document.addEventListener('keydown', (e) => {
            if (!addModal.classList.contains('hidden')) return; // หยุดคีย์บอร์ดลัดเมื่อเปิด Modal อยู่
            
            if (e.key === 'ArrowRight') nextBtn.click();
            if (e.key === 'ArrowLeft') prevBtn.click();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                containerElement.click();
            }
        });

        // Initialize App
        updateScoreDisplay();
        renderContent();
    </script>
</body>
</html>
