<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdTech Flashcards Pro - ระบบจัดการกองการ์ด</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Kanit & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="dashboard.html" class="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-500 hover:text-slate-700" title="กลับหน้า Dashboard">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div class="flex items-center space-x-2">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl">
                        <i data-lucide="layers" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-lg text-slate-800">EdTech Flashcards</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button id="open-deck-modal-btn" class="flex items-center space-x-1 border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium transition-all">
                    <i data-lucide="folder-plus" class="w-4 h-4"></i>
                    <span>สร้างกองการ์ดใหม่</span>
                </button>
                <button id="open-add-modal-btn" class="flex items-center space-x-1 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-all shadow-sm hover:shadow">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>เพิ่มการ์ด</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 flex flex-col items-center">
        
        <!-- Deck Selection Bar -->
        <div class="w-full bg-white border border-slate-200 rounded-xl p-4 mb-6 shadow-sm">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                <div class="flex items-center space-x-2 w-full sm:w-auto">
                    <i data-lucide="library" class="w-5 h-5 text-indigo-600 shrink-0"></i>
                    <label for="deck-select" class="text-sm font-semibold text-slate-700 shrink-0">เลือกกองการ์ด:</label>
                    <select id="deck-select" class="w-full sm:w-64 px-3 py-1.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                        <!-- Options generated dynamically -->
                    </select>
                </div>
                <button id="delete-deck-btn" class="text-xs text-red-500 hover:text-red-700 hover:bg-red-50 px-2 py-1 rounded transition-colors flex items-center space-x-1 self-end sm:self-auto">
                    <i data-lucide="folder-minus" class="w-3.5 h-3.5"></i>
                    <span>ลบกองการ์ดนี้</span>
                </button>
            </div>
        </div>

        <!-- Progress Header -->
        <div class="w-full flex items-center justify-between mb-4">
            <span id="category-badge" class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-100">
                General
            </span>
            <span id="progress-text" class="text-sm font-medium text-slate-500">
                Card 0 of 0
            </span>
        </div>

        <!-- Flashcard 3D Area -->
        <div class="w-full aspect-[4/3] max-w-lg perspective-1000 cursor-pointer group" id="flashcard-container">
            <div id="flashcard" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-2xl shadow-xl bg-white border border-slate-100">
                
                <!-- Front Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden rounded-2xl p-8 flex flex-col justify-between items-center bg-white text-center border-2 border-indigo-50">
                    <div class="w-full flex justify-end text-slate-300 group-hover:text-indigo-400 transition-colors">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                    </div>
                    <div class="my-auto">
                        <span class="text-xs font-semibold text-indigo-500 tracking-wider uppercase mb-2 block">คำถาม / หัวข้อ</span>
                        <h2 id="card-front-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-snug">
                            กำลังโหลดข้อมูล...
                        </h2>
                    </div>
                    <span class="text-xs text-slate-400">แตะการ์ดเพื่อพลิกดูเฉลย</span>
                </div>

                <!-- Back Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-2xl p-8 flex flex-col justify-between items-center bg-slate-900 text-white text-center border-2 border-slate-800">
                    <div class="w-full flex justify-end text-slate-500">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                    </div>
                    <div class="my-auto">
                        <span class="text-xs font-semibold text-emerald-400 tracking-wider uppercase mb-2 block">คำอธิบาย / เฉลย</span>
                        <p id="card-back-text" class="text-lg md:text-xl text-slate-200 font-light leading-relaxed">
                            -
                        </p>
                    </div>
                    <span class="text-xs text-slate-500">แตะเพื่อหมุนกลับ</span>
                </div>

            </div>
        </div>

        <!-- Controls -->
        <div class="w-full max-w-lg mt-6 flex items-center justify-between bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
            <button id="prev-btn" class="p-2.5 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="การ์ดก่อนหน้า">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            
            <div class="flex items-center space-x-2">
                <button id="shuffle-btn" class="p-2.5 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="สุ่มการ์ดในกอง">
                    <i data-lucide="shuffle" class="w-4 h-4"></i>
                </button>
                <button id="delete-card-btn" class="p-2.5 hover:bg-red-50 text-slate-400 hover:text-red-600 rounded-lg transition-colors" title="ลบการ์ดนี้">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            </div>

            <button id="next-btn" class="p-2.5 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="การ์ดถัดไป">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>
        </div>

    </main>

    <!-- Modal for Creating New Deck -->
    <div id="deck-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">สร้างกองการ์ดใหม่</h3>
                <button id="close-deck-modal-btn" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="add-deck-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อกองการ์ด / หมวดหมู่</label>
                    <input type="text" id="input-deck-name" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="เช่น กองที่ 1: ศัพท์ภาษาอังกฤษ">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" id="cancel-deck-btn" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">สร้างกองการ์ด</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Adding New Card -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">เพิ่ม Flashcard ในกองนี้</h3>
                <button id="close-add-modal-btn" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="add-card-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ด้านหน้า (คำถาม/หัวข้อ)</label>
                    <textarea id="input-front" required rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="กรอกข้อความด้านหน้า..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ด้านหลัง (คำอธิบาย/เฉลย)</label>
                    <textarea id="input-back" required rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="กรอกคำอธิบายด้านหลัง..."></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" id="cancel-add-btn" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript App Logic -->
    <script>
        // ดึง User ID จาก Session / LocalStorage / User Object ของระบบ Login (ปรับชื่อ Key ให้ตรงตามระบบของคุณได้)
        function getUserId() {
            const user = JSON.parse(localStorage.getItem('user')) || JSON.parse(sessionStorage.getItem('user'));
            return user?.id || user?.email || localStorage.getItem('current_user_id') || 'guest';
        }

        const userId = getUserId();

        // สรุปชื่อ Key แยกเฉพาะของผู้ใช้รายนั้นๆ
        const DECKS_KEY = `flashcard_decks_data_${userId}`;
        const CURRENT_DECK_KEY = `flashcard_current_deck_${userId}`;

        // ข้อมูลเริ่มต้นแยกเป็นกอง (Decks) กรณีเป็นไอดีใหม่
        const defaultDecks = {
            "กองที่ 1: ศัพท์ทั่วไป": [
                { front: "Pedagogy", back: "ศาสตร์และศิลป์แห่งการสอนเด็ก หรือวิธีการสอนโดยเน้นผู้เรียนและครูเป็นศูนย์กลางการเรียนรู้" },
                { front: "Andragogy", back: "แนวทางการจัดการเรียนรู้สำหรับผู้ใหญ่ (Adult Learning) ที่เน้นประสบการณ์และการนำไปใช้จริง" }
            ],
            "กองที่ 2: ทฤษฎีและการประเมิน": [
                { front: "Bloom's Taxonomy", back: "การจำแนกวัตถุประสงค์การเรียนรู้ 6 ระดับ: จำ -> เข้าใจ -> ประยุกต์ใช้ -> วิเคราะห์ -> ประเมินค่า -> สร้างสรรค์" },
                { front: "Formative Assessment", back: "การประเมินเพื่อปรับปรุงและพัฒนาการเรียนรู้ระหว่างกระบวนการสอน" }
            ]
        };

        // โหลดข้อมูลจาก LocalStorage ตาม User ID
        let decks = JSON.parse(localStorage.getItem(DECKS_KEY)) || defaultDecks;
        let activeDeckName = localStorage.getItem(CURRENT_DECK_KEY) || Object.keys(decks)[0] || "";

        let currentIndex = 0;
        let isFlipped = false;

        // DOM Elements
        const deckSelect = document.getElementById('deck-select');
        const deleteDeckBtn = document.getElementById('delete-deck-btn');
        
        const flashcardContainer = document.getElementById('flashcard-container');
        const flashcard = document.getElementById('flashcard');
        const cardFrontText = document.getElementById('card-front-text');
        const cardBackText = document.getElementById('card-back-text');
        const categoryBadge = document.getElementById('category-badge');
        const progressText = document.getElementById('progress-text');

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const deleteCardBtn = document.getElementById('delete-card-btn');

        // Modal Elements
        const addModal = document.getElementById('add-modal');
        const openAddModalBtn = document.getElementById('open-add-modal-btn');
        const closeAddModalBtn = document.getElementById('close-add-modal-btn');
        const cancelAddBtn = document.getElementById('cancel-add-btn');
        const addCardForm = document.getElementById('add-card-form');

        const deckModal = document.getElementById('deck-modal');
        const openDeckModalBtn = document.getElementById('open-deck-modal-btn');
        const closeDeckModalBtn = document.getElementById('close-deck-modal-btn');
        const cancelDeckBtn = document.getElementById('cancel-deck-btn');
        const addDeckForm = document.getElementById('add-deck-form');

        // บันทึกลง LocalStorage
        function saveData() {
            localStorage.setItem(DECKS_KEY, JSON.stringify(decks));
            localStorage.setItem(CURRENT_DECK_KEY, activeDeckName);
        }

        // แสดงผลรายการ Deck ใน Select Dropdown
        function renderDeckOptions() {
            deckSelect.innerHTML = '';
            const deckNames = Object.keys(decks);

            if (deckNames.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "-- ไม่มีกองการ์ด --";
                deckSelect.appendChild(opt);
                activeDeckName = "";
                return;
            }

            if (!decks[activeDeckName]) {
                activeDeckName = deckNames[0];
            }

            deckNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                if (name === activeDeckName) option.selected = true;
                deckSelect.appendChild(option);
            });
        }

        // แสดงผลการ์ดปัจจุบัน
        function renderCard() {
            const currentCards = decks[activeDeckName] || [];

            if (currentCards.length === 0) {
                cardFrontText.textContent = activeDeckName ? "ไม่มีการ์ดในกองนี้" : "ยังไม่มีกองการ์ด";
                cardBackText.textContent = "กดปุ่ม 'เพิ่มการ์ด' ด้านบนเพื่อสร้างการ์ดใบแรก";
                categoryBadge.textContent = activeDeckName || "None";
                progressText.textContent = "0 of 0";
                return;
            }

            // Reset Flip State
            if (isFlipped) {
                flashcard.classList.remove('rotate-y-180');
                isFlipped = false;
            }

            const current = currentCards[currentIndex];
            cardFrontText.textContent = current.front;
            cardBackText.textContent = current.back;
            categoryBadge.textContent = activeDeckName;
            progressText.textContent = `Card ${currentIndex + 1} of ${currentCards.length}`;
        }

        // พลิกการ์ด
        flashcardContainer.addEventListener('click', () => {
            const currentCards = decks[activeDeckName] || [];
            if (currentCards.length === 0) return;
            isFlipped = !isFlipped;
            flashcard.classList.toggle('rotate-y-180', isFlipped);
        });

        // สลับกองการ์ด
        deckSelect.addEventListener('change', (e) => {
            activeDeckName = e.target.value;
            currentIndex = 0;
            saveData();
            renderCard();
        });

        // ปุ่มควบคุม Navigation
        prevBtn.addEventListener('click', () => {
            const currentCards = decks[activeDeckName] || [];
            if (currentCards.length === 0) return;
            currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
            renderCard();
        });

        nextBtn.addEventListener('click', () => {
            const currentCards = decks[activeDeckName] || [];
            if (currentCards.length === 0) return;
            currentIndex = (currentIndex + 1) % currentCards.length;
            renderCard();
        });

        shuffleBtn.addEventListener('click', () => {
            const currentCards = decks[activeDeckName] || [];
            if (currentCards.length <= 1) return;
            for (let i = currentCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentCards[i], currentCards[j]] = [currentCards[j], currentCards[i]];
            }
            currentIndex = 0;
            saveData();
            renderCard();
        });

        deleteCardBtn.addEventListener('click', () => {
            const currentCards = decks[activeDeckName] || [];
            if (currentCards.length === 0) return;

            if (confirm("คุณแน่ใจหรือไม่ว่าต้องการลบการ์ดใบนี้?")) {
                currentCards.splice(currentIndex, 1);
                if (currentIndex >= currentCards.length && currentIndex > 0) {
                    currentIndex--;
                }
                saveData();
                renderCard();
            }
        });

        // ลบกองการ์ด
        deleteDeckBtn.addEventListener('click', () => {
            if (!activeDeckName || !decks[activeDeckName]) return;

            if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบ "${activeDeckName}" พร้อมการ์ดทั้งหมดในกอง?`)) {
                delete decks[activeDeckName];
                const remainingDecks = Object.keys(decks);
                activeDeckName = remainingDecks.length > 0 ? remainingDecks[0] : "";
                currentIndex = 0;
                saveData();
                renderDeckOptions();
                renderCard();
            }
        });

        // Modal - เพิ่ม Deck
        openDeckModalBtn.addEventListener('click', () => deckModal.classList.remove('hidden'));
        closeDeckModalBtn.addEventListener('click', () => deckModal.classList.add('hidden'));
        cancelDeckBtn.addEventListener('click', () => deckModal.classList.add('hidden'));

        addDeckForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const deckName = document.getElementById('input-deck-name').value.trim();

            if (deckName) {
                if (!decks[deckName]) {
                    decks[deckName] = [];
                }
                activeDeckName = deckName;
                currentIndex = 0;
                saveData();
                renderDeckOptions();
                renderCard();
                
                deckModal.classList.add('hidden');
                addDeckForm.reset();
            }
        });

        // Modal - เพิ่ม Card
        openAddModalBtn.addEventListener('click', () => {
            if (!activeDeckName) {
                alert("กรุณาสร้างกองการ์ดก่อนเพิ่มการ์ด");
                deckModal.classList.remove('hidden');
                return;
            }
            addModal.classList.remove('hidden');
        });
        closeAddModalBtn.addEventListener('click', () => addModal.classList.add('hidden'));
        cancelAddBtn.addEventListener('click', () => addModal.classList.add('hidden'));

        addCardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const front = document.getElementById('input-front').value.trim();
            const back = document.getElementById('input-back').value.trim();

            if (front && back && activeDeckName) {
                if (!decks[activeDeckName]) decks[activeDeckName] = [];
                
                decks[activeDeckName].push({ front, back });
                currentIndex = decks[activeDeckName].length - 1;
                
                saveData();
                renderCard();
                
                addModal.classList.add('hidden');
                addCardForm.reset();
            }
        });

        // Initialize Icons & Render App
        lucide.createIcons();
        renderDeckOptions();
        renderCard();
    </script>
</body>
</html>
