<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdTech Flashcards Pro - สรุปบทเรียน & บล็อกคำถาม</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Kanit & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="dashboard.html" class="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-500 hover:text-slate-700" title="กลับหน้า Dashboard">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div class="flex items-center space-x-2">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl">
                        <i data-lucide="layers" class="w-5 h-5"></i>
                    </div>
                    <span class="font-bold text-lg text-slate-800">EdTech Flashcards</span>
                </div>
            </div>

            <!-- Score / Point Badge (Synced with LocalStorage) -->
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-full">
                    <i data-lucide="award" class="w-5 h-5 text-amber-500 fill-amber-400"></i>
                    <span class="text-xs font-semibold text-amber-700 uppercase tracking-wider">Score:</span>
                    <span id="score-display" class="font-bold text-amber-800 text-sm">0</span>
                </div>
                <button id="open-add-modal-btn" class="flex items-center space-x-1 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-all shadow-sm hover:shadow">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>เพิ่มการ์ด</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 flex flex-col items-center justify-center">
        
        <!-- Category & Progress Header -->
        <div class="w-full flex items-center justify-between mb-6">
            <span id="category-badge" class="bg-indigo-50 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full border border-indigo-100">
                General
            </span>
            <span id="progress-text" class="text-sm font-medium text-slate-500">
                Card 0 of 0
            </span>
        </div>

        <!-- Flashcard 3D Area -->
        <div class="w-full aspect-[4/3] max-w-lg perspective-1000 cursor-pointer group" id="flashcard-container">
            <div id="flashcard" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-2xl shadow-xl bg-white border border-slate-100">
                
                <!-- Front Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden rounded-2xl p-8 flex flex-col justify-between items-center bg-white text-center border-2 border-indigo-50">
                    <div class="w-full flex justify-end text-slate-300 group-hover:text-indigo-400 transition-colors">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                    </div>
                    <div class="my-auto">
                        <span class="text-xs font-semibold text-indigo-500 tracking-wider uppercase mb-2 block">คำถาม / หัวข้อ</span>
                        <h2 id="card-front-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-snug">
                            กำลังโหลดข้อมูล...
                        </h2>
                    </div>
                    <span class="text-xs text-slate-400">แตะการ์ดเพื่อพลิกดูเฉลย</span>
                </div>

                <!-- Back Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-2xl p-8 flex flex-col justify-between items-center bg-slate-900 text-white text-center border-2 border-slate-800">
                    <div class="w-full flex justify-end text-slate-500">
                        <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                    </div>
                    <div class="my-auto">
                        <span class="text-xs font-semibold text-emerald-400 tracking-wider uppercase mb-2 block">คำอธิบาย / เฉลย</span>
                        <p id="card-back-text" class="text-lg md:text-xl text-slate-200 font-light leading-relaxed">
                            -
                        </p>
                    </div>
                    <span class="text-xs text-slate-500">แตะเพื่อหมุนกลับ</span>
                </div>

            </div>
        </div>

        <!-- Controls & Scoring Action -->
        <div class="w-full max-w-lg mt-8 flex flex-col gap-4">
            <!-- Scoring Button -->
            <button id="remember-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white py-3.5 rounded-xl font-medium shadow-md shadow-emerald-600/20 flex items-center justify-center space-x-2 transition-all">
                <i data-lucide="check-circle" class="w-5 h-5"></i>
                <span>จำได้ (+0.5 พอยท์)</span>
            </button>

            <!-- Navigation Controls -->
            <div class="flex items-center justify-between bg-white p-2 rounded-xl border border-slate-200 shadow-sm">
                <button id="prev-btn" class="p-2.5 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="การ์ดก่อนหน้า">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                
                <div class="flex items-center space-x-2">
                    <button id="shuffle-btn" class="p-2.5 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="สุ่มการ์ด">
                        <i data-lucide="shuffle" class="w-4 h-4"></i>
                    </button>
                    <button id="delete-card-btn" class="p-2.5 hover:bg-red-50 text-slate-400 hover:text-red-600 rounded-lg transition-colors" title="ลบการ์ดนี้">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>

                <button id="next-btn" class="p-2.5 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors" title="การ์ดถัดไป">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- Modal for Adding New Card -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">เพิ่ม Flashcard ใหม่</h3>
                <button id="close-add-modal-btn" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="add-card-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">หมวดหมู่</label>
                    <input type="text" id="input-category" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="เช่น Terminology, Theory">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ด้านหน้า (คำถาม/หัวข้อ)</label>
                    <textarea id="input-front" required rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="กรอกข้อความด้านหน้า..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ด้านหลัง (คำอธิบาย/เฉลย)</label>
                    <textarea id="input-back" required rows="3" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="กรอกคำอธิบายด้านหลัง..."></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" id="cancel-add-btn" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Data and App Logic -->
    <script>
        // ข้อมูลเริ่มต้นสำหรับกรณีเพิ่งใช้งานครั้งแรก
        const defaultFlashcards = [
            {
                front: "Pedagogy",
                back: "ศาสตร์และศิลป์แห่งการสอนเด็ก หรือวิธีการสอนโดยเน้นผู้เรียนและครูเป็นศูนย์กลางการเรียนรู้",
                category: "Terminology"
            },
            {
                front: "Andragogy",
                back: "แนวทางการจัดการเรียนรู้สำหรับผู้ใหญ่ (Adult Learning) ที่เน้นประสบการณ์และการนำไปใช้จริง",
                category: "Terminology"
            },
            {
                front: "Bloom's Taxonomy",
                back: "การจำแนกวัตถุประสงค์การเรียนรู้ 6 ระดับ: จำ -> เข้าใจ -> ประยุกต์ใช้ -> วิเคราะห์ -> ประเมินค่า -> สร้างสรรค์",
                category: "Theory"
            },
            {
                front: "Formative Assessment",
                back: "การประเมินเพื่อปรับปรุงและพัฒนาการเรียนรู้ระหว่างกระบวนการสอน (เช่น ควิซสั้น, การตั้งคำถาม)",
                category: "Assessment"
            },
            {
                front: "Active Learning",
                back: "กระบวนการเรียนรู้ที่ให้ผู้เรียนมีส่วนร่วมในการคิด วิเคราะห์ ทำกิจกรรม และสรุปองค์ความรู้ด้วยตนเอง",
                category: "Strategy"
            }
        ];

        // -------------------------------------------------------------
        // 1. ตั้งค่า KEY กลางสำหรับ localStorage (ต้องตรงกับหน้า dashboard.html)
        // -------------------------------------------------------------
        const SCORE_KEY = 'userPoints'; // <-- ตรวจสอบชื่อ Key ให้ตรงกับหน้าหลัก
        const FLASHCARDS_KEY = 'flashcards_data';

        // โหลดข้อมูลการ์ดและคะแนน
        let flashcards = JSON.parse(localStorage.getItem(FLASHCARDS_KEY)) || defaultFlashcards;
        let score = parseFloat(localStorage.getItem(SCORE_KEY)) || 0;

        let currentIndex = 0;
        let isFlipped = false;

        // DOM Elements
        const scoreDisplay = document.getElementById('score-display');
        const flashcardContainer = document.getElementById('flashcard-container');
        const flashcard = document.getElementById('flashcard');
        const cardFrontText = document.getElementById('card-front-text');
        const cardBackText = document.getElementById('card-back-text');
        const categoryBadge = document.getElementById('category-badge');
        const progressText = document.getElementById('progress-text');

        const rememberBtn = document.getElementById('remember-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const deleteCardBtn = document.getElementById('delete-card-btn');

        const addModal = document.getElementById('add-modal');
        const openAddModalBtn = document.getElementById('open-add-modal-btn');
        const closeAddModalBtn = document.getElementById('close-add-modal-btn');
        const cancelAddBtn = document.getElementById('cancel-add-btn');
        const addCardForm = document.getElementById('add-card-form');

        // Update Score UI + Save to LocalStorage
        function updateScore(newScore) {
            score = newScore;
            scoreDisplay.textContent = score;
            // บันทึกกลับลง localStorage เพื่อให้หน้าหลักอ่านได้
            localStorage.setItem(SCORE_KEY, score.toString());
        }

        // Display current card
        function renderCard() {
            if (flashcards.length === 0) {
                cardFrontText.textContent = "ไม่มีข้อมูลการ์ด";
                cardBackText.textContent = "กรุณาเพิ่มการ์ดใหม่";
                categoryBadge.textContent = "None";
                progressText.textContent = "0 of 0";
                return;
            }

            // Reset Flip State
            if (isFlipped) {
                flashcard.classList.remove('rotate-y-180');
                isFlipped = false;
            }

            const current = flashcards[currentIndex];
            cardFrontText.textContent = current.front;
            cardBackText.textContent = current.back;
            categoryBadge.textContent = current.category || "General";
            progressText.textContent = `Card ${currentIndex + 1} of ${flashcards.length}`;
        }

        // Event: Flip Card
        flashcardContainer.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            isFlipped = !isFlipped;
            flashcard.classList.toggle('rotate-y-180', isFlipped);
        });

        // Event: Add Points (+0.5)
        rememberBtn.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            updateScore(score + 0.5);
            
            // เปลี่ยนการ์ดถัดไปอัตโนมัติ
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            renderCard();
        });

        // Navigation Controls
        prevBtn.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            currentIndex = (currentIndex - 1 + flashcards.length) % flashcards.length;
            renderCard();
        });

        nextBtn.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            currentIndex = (currentIndex + 1) % flashcards.length;
            renderCard();
        });

        shuffleBtn.addEventListener('click', () => {
            if (flashcards.length <= 1) return;
            for (let i = flashcards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
            }
            currentIndex = 0;
            localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(flashcards));
            renderCard();
        });

        deleteCardBtn.addEventListener('click', () => {
            if (flashcards.length === 0) return;
            if (confirm("คุณแน่ใจหรือไม่ว่าต้องการลบการ์ดนี้?")) {
                flashcards.splice(currentIndex, 1);
                if (currentIndex >= flashcards.length && currentIndex > 0) {
                    currentIndex--;
                }
                localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(flashcards));
                renderCard();
            }
        });

        // Modal Controls
        openAddModalBtn.addEventListener('click', () => addModal.classList.remove('hidden'));
        closeAddModalBtn.addEventListener('click', () => addModal.classList.add('hidden'));
        cancelAddBtn.addEventListener('click', () => addModal.classList.add('hidden'));

        addCardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const front = document.getElementById('input-front').value.trim();
            const back = document.getElementById('input-back').value.trim();
            const category = document.getElementById('input-category').value.trim();

            if (front && back) {
                flashcards.push({ front, back, category });
                localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(flashcards));
                currentIndex = flashcards.length - 1;
                renderCard();
                addModal.classList.add('hidden');
                addCardForm.reset();
            }
        });

        // Initialize Lucide Icons
        lucide.createIcons();

        // Initial Setup
        updateScore(score);
        renderCard();
    </script>
</body>
</html>
